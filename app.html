<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube controller</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main aria-label="YouTube compact controller">
    <div class="topline"><span id="status" role="status">Connecting…</span><button id="open-youtube" class="text-button" type="button">Open YouTube</button><button id="settings" class="text-button" type="button">Settings</button></div>
    <div class="title-row"><div id="title" class="title" title="No video selected">No video selected</div><button id="compact-toggle" class="text-button" type="button" aria-pressed="false">Compact</button></div>
    <input id="seek" class="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek">
    <div class="controls">
      <button data-command="PREVIOUS" type="button" aria-label="Previous video">⏮</button>
      <button data-command="PLAY_PAUSE" class="play" type="button" aria-label="Play or pause">▶</button>
      <button data-command="NEXT" type="button" aria-label="Next video">⏭</button>
      <button data-command="SHUFFLE" class="advanced" type="button" aria-label="Toggle shuffle" aria-pressed="false">🔀</button>
      <label class="advanced repeat-control">Repeat <select id="repeat" aria-label="Repeat mode"><option value="off">Off</option><option value="all">All</option><option value="one">One</option></select></label>
      <label class="advanced volume" aria-label="Volume">🔊 <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume"><span id="volume-value">100%</span></label>
      <button id="playlists" class="advanced text-button" type="button">Playlists</button>
    </div>
    <section id="settings-panel" hidden aria-label="Settings">
      <form id="settings-form"><label for="playlist-url">Playlist to preload</label><input id="playlist-url" type="url" placeholder="https://www.youtube.com/playlist?list=..." spellcheck="false"><label class="check"><input id="always-on-top" type="checkbox"> Keep controller always on top</label><div class="settings-actions"><button type="submit">Save</button><button id="close-settings" type="button" class="secondary">Close</button><span id="settings-status" role="status"></span></div></form>
    </section>
    <p id="message" class="message" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
