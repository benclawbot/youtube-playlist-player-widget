<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Playlist Player Widget</title>
  <desc id="desc">A compact desktop controller with a play button, playlist queue and waveform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10162d"/><stop offset="1" stop-color="#25133b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff003d"/><stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="620" rx="36" fill="url(#bg)"/>
  <circle cx="1370" cy="75" r="220" fill="#5c2f91" opacity=".18"/><circle cx="115" cy="550" r="280" fill="#ff003d" opacity=".1"/>
  <g fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="100" y="155" font-size="28" letter-spacing="6" fill="#ff7a8f">PERSONAL DESKTOP PLAYER</text>
    <text x="100" y="235" font-size="70" font-weight="700">YouTube Playlist</text>
    <text x="100" y="315" font-size="70" font-weight="700">Player Widget</text>
    <text x="100" y="375" font-size="24" fill="#bdc4df">Your normal YouTube session. Your playlists. A compact controller.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="875" y="115" width="610" height="310" rx="22" fill="#20243a" stroke="#4b5275" stroke-width="2"/>
    <rect x="907" y="150" width="350" height="16" rx="8" fill="#606987"/><rect x="907" y="181" width="250" height="10" rx="5" fill="#454c69"/>
    <circle cx="953" cy="267" r="42" fill="url(#glow)"/><path d="M940 241l33 26-33 26z" fill="#fff"/>
    <rect x="1030" y="250" width="110" height="8" rx="4" fill="#8c95ba"/><rect x="1030" y="273" width="170" height="8" rx="4" fill="#515977"/>
    <g stroke="#ff5974" stroke-width="7" stroke-linecap="round"><path d="M1280 285v-24"/><path d="M1300 285v-46"/><path d="M1320 285v-70"/><path d="M1340 285v-35"/><path d="M1360 285v-56"/><path d="M1380 285v-28"/></g>
    <rect x="907" y="345" width="520" height="4" rx="2" fill="#454c69"/><rect x="907" y="345" width="280" height="4" rx="2" fill="#ff3e60"/>
    <circle cx="1187" cy="347" r="8" fill="#fff"/>
  </g>
  <g fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18"><text x="100" y="515" fill="#bdc4df">SIGN IN ONCE  •  REUSE YOUR APP SESSION  •  WINDOWS + LINUX</text></g>
</svg>
